id: CKL-GATE-004
name: "Planning to Executing Gate"
phase_from: planning
phase_to: executing
version: 1

items:
  - id: CKL-GATE-004-01
    check: "ARCH artifacts exist for approved requirements"
    automated: true
    script: "ls _specflow/specs/architecture/*.md 2>/dev/null | grep -v _index.yaml | head -1 | grep -q . && exit 0 || exit 1"
    severity: blocking

  - id: CKL-GATE-004-02
    check: "All ARCH artifacts pass schema validation"
    automated: true
    script: "uv run specflow artifact-lint --type schema"
    severity: blocking

  - id: CKL-GATE-004-03
    check: "STORY artifacts exist and link to approved specs"
    automated: true
    script: "ls _specflow/work/stories/*.md 2>/dev/null | grep -v _index.yaml | head -1 | grep -q . && exit 0 || exit 1"
    severity: blocking

  - id: CKL-GATE-004-04
    check: "No broken links in architecture or stories"
    automated: true
    script: "uv run specflow artifact-lint --type links"
    severity: blocking

  - id: CKL-GATE-004-09
    check: "Every STORY links to a spec artifact (REQ/ARCH/DDD); research is a SPIKE"
    automated: true
    script: "uv run specflow artifact-lint --type story-linkage"
    severity: blocking

  - id: CKL-GATE-004-10
    check: "No STORY beyond draft links to a spec still in draft (no implementing against unapproved specs)"
    automated: true
    script: "uv run specflow artifact-lint --type status-cascade"
    severity: blocking

  - id: CKL-GATE-004-05
    check: "Every STORY has a clear acceptance definition"
    automated: false
    llm_prompt: "Review each STORY artifact. Confirm it has clear, testable acceptance criteria and links to at least one approved specification artifact."
    severity: blocking

  - id: CKL-GATE-004-06
    check: "Architecture defines component interfaces"
    automated: false
    llm_prompt: "Review each ARCH artifact. Confirm every component defines its public interface, failure modes, and dependencies."
    severity: warning

  - id: CKL-GATE-004-07
    check: "Each STORY has a defined test strategy"
    automated: false
    llm_prompt: "For each STORY, confirm the body or its linked DDD artifact specifies how the story will be verified (which acceptance criteria map to UT / IT / QT). Flag any STORY where the test approach is implicit or absent."
    severity: warning

  - id: CKL-GATE-004-08
    check: "Story dependencies and upstream specs are approved"
    automated: false
    llm_prompt: "For each STORY, walk its links (specified_by, derives_from, depends_on). Confirm every referenced upstream artifact has status `approved` (or `implemented`). Flag any STORY whose readiness depends on a draft artifact."
    severity: warning

  - id: CKL-GATE-004-11
    check: "Approved ARCH/DDD artifacts record the thinking techniques applied (advisory — presence, not quality)"
    automated: true
    script: "uv run specflow artifact-lint --type thinking-techniques"
    severity: warning
