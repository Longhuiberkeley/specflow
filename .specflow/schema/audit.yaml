type: audit
category: review
prefix: AUD
id_format: "AUD-\\d{3,5}$"
required_fields: [id, title, type, status, created]
optional_fields: [review_status, priority, rationale, tags, links, modified, thinking_techniques, summary_errors, summary_warns, summary_info, chain_coverage_pct, summary_warns_escalating, summary_warns_accounting]
allowed_status:
  open: []
  closed: [open]
allowed_review_status: [unreviewed, reviewed, flagged, addressed, accepted, stale]
allowed_link_roles: [refers_to]
directory: _specflow/specs/audits/
