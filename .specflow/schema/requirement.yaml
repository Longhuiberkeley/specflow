type: requirement
category: spec
prefix: REQ
id_format: "REQ-\\d{3,5}(\\.\\d{1,3})?$"
required_fields: [id, title, type, status, created]
optional_fields: [priority, version, rationale, tags, suspect, fingerprint, links, doc_refs, upstream, checklists_applied, modified, non_functional_category, reqif_metadata, thinking_techniques]
allowed_status:
  draft: []
  approved: [draft]
  implemented: [approved]
  verified: [implemented]
  deprecated: [approved, implemented, verified]
  cancelled: [draft, approved, implemented, verified]
allowed_link_roles: [refined_by, verified_by, derives_from, complies_with, validated_by]
directory: _specflow/specs/requirements/
