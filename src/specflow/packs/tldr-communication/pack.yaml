description: >
  Two small additions to the base reply style: recap only when context may have
  compacted, and gloss any jargon term in one plain (ELI5) clause. The base
  AGENTS.md block already leads with the answer or next action, so this pack
  adds only that delta. Adapted from github.com/ayghri/i-have-adhd (behavioural
  shaping, no diagnosis implied).
