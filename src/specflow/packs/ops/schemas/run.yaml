type: run
category: ops
prefix: RUN
id_format: "^RUN-\\d{3,5}$"
required_fields: [id, title, type, status, created, environment, deployed_ref]
optional_fields: [description, deployed_at, config, health, last_observed, retired_at, tags, suspect, fingerprint, links, modified, thinking_techniques]
allowed_status:
  deployed: []
  live: [deployed]
  paused: [live]
  retired: [live, paused]
allowed_link_roles: [derives_from, implements, complies_with]
directory: _specflow/ops/runs/
