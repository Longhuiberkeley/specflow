type: finding
category: research
prefix: FIND
id_format: "^FIND-\\d{3}$"
required_fields: [id, title, type, status, created, summary, confidence, competition]
optional_fields: [description, source_loop, what_worked, what_failed, next_steps, experiment_count, best_metric, applies_to, deployability, safety_assessment, applies_to_domain, tags, suspect, fingerprint, links, modified, thinking_techniques]
allowed_status:
  draft: []
  confirmed: [draft]
  superseded: [confirmed]
  falsified: [confirmed]
allowed_link_roles: [belongs_to, condenses, supersedes, validated_by, derives_from]
directory: _specflow/specs/findings/
