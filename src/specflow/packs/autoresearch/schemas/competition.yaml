type: competition
category: research
prefix: COMP
id_format: "^COMP-\\d{3}$"
required_fields: [id, title, type, status, created, verify_command, metric_name, metric_direction]
optional_fields: [description, dataset, split_method, assets, timeframe, guard_command, guard_mode, tags, suspect, fingerprint, links, modified, thinking_techniques]
allowed_status:
  active: []
  paused: [active]
  completed: [active]
  archived: [active, completed]
allowed_link_roles: [derives_from, guided_by]
directory: _specflow/specs/competitions/
