type: experiment
category: research
prefix: EXPT
id_format: "^EXPT-\\d{3,5}$"
required_fields: [id, title, type, status, created, loop, metric_value, change_category, summary]
optional_fields: [description, commit, hypothesis, hypothesis_outcome, parameters, model_origin, sweep_results, checks, baseline_note, diversity_metrics, failure_analysis, guard_value, guard_passed, strategy_used, delta, duration_seconds, auxiliary_metrics, tags, suspect, fingerprint, links, modified, thinking_techniques]
allowed_status:
  kept: []
  discarded: []
  crashed: []
  no_op: []
allowed_link_roles: [belongs_to, derives_from]
directory: _specflow/specs/experiments/
