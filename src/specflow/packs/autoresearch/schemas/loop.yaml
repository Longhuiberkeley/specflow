type: loop
category: research
prefix: LOOP
id_format: "^LOOP-\\d{3}$"
required_fields: [id, title, type, status, created, competition, mode, budget]
optional_fields: [description, goal, active_research_questions, required_findings, termination_suggestions, best_metric, best_experiment, plateau_patience, knowledge_input, started_at, completed_at, iteration_count, kept_count, discarded_count, tags, suspect, fingerprint, links, modified, thinking_techniques]
allowed_status:
  draft: []
  running: [draft]
  completed: [running]
  plateaued: [running]
  aborted: [running, draft]
allowed_link_roles: [operates_on, informs, guided_by]
directory: _specflow/specs/loops/
