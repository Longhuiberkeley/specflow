# LOOP (research loop) schema — autoresearch pack.
#
# `research_agenda` entries (freeform; rendered by `autoresearch status`):
#   {direction, status: unexplored|in_progress|promising|exhausted,
#    expected_impact, rationale,
#    priority: pursue|deprioritize|blocked|revisit,   # a decision, not evidence
#    progress: "<new evidence + the next decision it feeds>"}
# Decomposition is a hypothesis: the agenda records the width of plausible
# formulations (assumptions, tradeoffs, evaluation) — there is no direction
# quota. `priority` is a decision, separate from evidence
# (`hypothesis_outcome` lives on the EXPT); deprioritize/blocked close a
# direction out of the open list, revisit keeps it open. Evidence movement for
# the `status` reassessment comes from each EXPT's `research_progress` note
# over its last three attempts (see experiment.yaml); `progress` here is the
# direction-level decision note.
type: loop
category: research
prefix: LOOP
id_format: "^LOOP-\\d{3,5}$"
required_fields: [id, title, type, status, created, competition, mode, budget]
optional_fields: [description, goal, active_research_questions, required_findings, termination_suggestions, best_metric, best_experiment, plateau_patience, knowledge_input, started_at, completed_at, iteration_count, kept_count, discarded_count, eda_completed, eda_summary, research_agenda, category_coverage, condensation_briefs, stuck_state, lessons_learned, looplevel_findings, unexplored_directions, surprise_budget_used, tags, suspect, fingerprint, links, modified, thinking_techniques]
allowed_status:
  draft: []
  running: [draft]
  completed: [running]
  plateaued: [running]
  aborted: [running, draft]
allowed_link_roles: [operates_on, informs, guided_by, derives_from]
directory: _specflow/specs/loops/
