name: autoresearch
version: "0.2.0"
description: >
  Autonomous research loop for SpecFlow. Adds competition-scoped
  experimentation with knowledge condensation. Adapted from
  https://github.com/Longhuiberkeley/autoresearch_fork which builds on
  https://github.com/uditgoenka/autoresearch (itself based on
  https://github.com/karpathy/autoresearch).
adds_artifact_types:
  - competition
  - loop
  - experiment
  - finding
adds_directories:
  - specs/competitions
  - specs/loops
  - specs/experiments
  - specs/findings
adds_skills:
  - specflow-autoresearch
context_snippet: |
  ### Autoresearch Pack (optional)
  This project has the **autoresearch** pack installed. It is a **separate subsystem** from core SpecFlow engineering.
  **Artifact types:** COMP, LOOP, EXPT, FIND.
  **Trigger only when** the user explicitly asks to run a research loop, set up a competition, review leaderboards, or iterate experiments autonomously.
  **Never use for:** codebase exploration, code review, bug investigation, feature implementation, data preparation, or general engineering questions — those are core SpecFlow engineering.
  For full protocol details, invoke `/specflow-autoresearch` (loads the skill on demand).
