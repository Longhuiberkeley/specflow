name: autoresearch
version: "0.2.0"
description: >
  Autonomous research loop for SpecFlow. Adds competition-scoped
  experimentation with knowledge condensation. Adapted from
  https://github.com/Longhuiberkeley/autoresearch_fork which builds on
  https://github.com/uditgoenka/autoresearch (itself based on
  https://github.com/karpathy/autoresearch).
adds_artifact_types:
  - competition
  - loop
  - experiment
  - finding
adds_directories:
  - specs/competitions
  - specs/loops
  - specs/experiments
  - specs/findings
adds_skills:
  - specflow-autoresearch
context_snippet: |
  ### Autoresearch Pack
  This project uses the **autoresearch** pack for autonomous research loops.

  **Artifact types:** COMP (competition), LOOP (iteration loop), EXPT (experiment), FIND (finding)

  **Slash commands:**
  | Command | Purpose |
  |---------|---------|
  | `/specflow-autoresearch` | Run an autonomous LOOP on a COMP |
  | `/specflow-autoresearch:plan` | Plan a LOOP before running |
  | `/specflow-autoresearch:review` | Review FINDs and EXPTs |
  | `/specflow-autoresearch:leaderboard` | Top EXPTs ranked by metric |
  | `/specflow-autoresearch:log` | Log an EXPT and auto-update LOOP counters |
  | `/specflow-autoresearch:suggest-finds` | Draft FINDs from a completed LOOP's EXPTs |

  **CLI commands:** `specflow autoresearch plan|run|review|leaderboard|log|suggest-finds`

  **Lifecycle:** `COMP (active) → LOOP (draft→running→completed) → EXPT (kept/discarded) → FIND (draft→confirmed)`

  **Key rules:**
  - One running LOOP per COMP at a time
  - EXPT status is terminal (kept/discarded/crashed/no_op)
  - Primary metric drives the kept/discarded decision; guards are binary floors; auxiliary metrics are logged for review
  - Verify command outputs one number to stdout; rich diagnostics go to disk
  - After LOOP completion, always review EXPTs and author/update FINDs
  - Use `specflow autoresearch log` instead of raw `specflow create --type experiment` + `specflow update LOOP` — it is atomic and context-cheaper
  - Spawn parallel subagents per `change_category` when synthesizing FINDs after a LOOP to keep context small
