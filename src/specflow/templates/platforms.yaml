# SpecFlow Platform Registry
#
# Each platform entry defines:
#   name:             Display name shown to users
#   preferred:        Whether shown as a recommended option on install
#   skills_dir:       Where to copy SpecFlow skill directories
#   instruction_file: Where to inject pack context (AGENTS.md, CLAUDE.md, etc.)
#   detection:        Directory/file markers used to auto-detect this platform
#   legacy_dirs:      (optional) Old directories to clean up on reinstall

platforms:

  claude-code:
    name: "Claude Code"
    preferred: true
    skills_dir: .claude/skills
    instruction_file: AGENTS.md
    detection:
      - .claude/
    legacy_dirs:
      - .claude/commands

  cursor:
    name: "Cursor"
    preferred: true
    skills_dir: .cursor/skills
    instruction_file: .cursor/rules/specflow.md
    detection:
      - .cursor/
    legacy_dirs:
      - .cursor/commands

  windsurf:
    name: "Windsurf"
    preferred: false
    skills_dir: .windsurf/skills
    instruction_file: .windsurf/rules/specflow.md
    detection:
      - .windsurf/
    legacy_dirs:
      - .windsurf/workflows

  cline:
    name: "Cline"
    preferred: false
    skills_dir: .cline/skills
    instruction_file: .clinerules/specflow.md
    detection:
      - .cline/
    legacy_dirs:
      - .clinerules/workflows

  gemini:
    name: "Gemini CLI"
    preferred: false
    skills_dir: .gemini/skills
    instruction_file: GEMINI.md
    detection:
      - .gemini/
    legacy_dirs:
      - .gemini/commands

  opencode:
    name: "OpenCode"
    preferred: true
    skills_dir: .opencode/skills
    instruction_file: AGENTS.md
    detection:
      - .opencode/
    legacy_dirs:
      - .opencode/agents
      - .opencode/commands

  github-copilot:
    name: "GitHub Copilot"
    preferred: false
    skills_dir: .github/skills
    instruction_file: .github/copilot-instructions.md
    detection:
      - .github/copilot-instructions.md
    legacy_dirs:
      - .github/agents
      - .github/prompts

  roo:
    name: "Roo Code"
    preferred: false
    skills_dir: .roo/skills
    instruction_file: .roo/rules/specflow.md
    detection:
      - .roo/
    legacy_dirs:
      - .roo/commands

  qwen:
    name: "QwenCoder"
    preferred: false
    skills_dir: .qwen/skills
    instruction_file: .qwen/rules/specflow.md
    detection:
      - .qwen/
    legacy_dirs:
      - .qwen/commands

  kiro:
    name: "Kiro"
    preferred: false
    skills_dir: .kiro/skills
    instruction_file: .kiro/steering/specflow.md
    detection:
      - .kiro/
    legacy_dirs:
      - .kiro/steering

  kilocode:
    name: "KiloCoder"
    preferred: false
    skills_dir: .kilocode/skills
    instruction_file: .kilocode/rules/specflow.md
    detection:
      - .kilocode/
    legacy_dirs:
      - .kilocode/workflows

  codex:
    name: "Codex"
    preferred: false
    skills_dir: .agents/skills
    instruction_file: AGENTS.md
    detection:
      - .codex/
    legacy_dirs:
      - .codex/prompts

  trae:
    name: "Trae"
    preferred: false
    skills_dir: .trae/skills
    instruction_file: .trae/rules/specflow.md
    detection:
      - .trae/
