type: review
prefix: REVIEW
id_format: "REVIEW-\\d{3,4}$"
required_fields: [id, title, type, status, created]
optional_fields: [review_status, rationale, tags, suspect, fingerprint, links, modified, artifact_ref, reviewers, consensus, findings, depth, thinking_techniques]
allowed_status:
  open: []
  closed: [open]
allowed_review_status: [unreviewed, reviewed, flagged, addressed, accepted, stale]
allowed_link_roles: [review_of, refers_to]
directory: _specflow/specs/reviews/
