type: architecture
category: spec
prefix: ARCH
id_format: "ARCH-\\d{3,5}(\\.\\d{1,3})?$"
required_fields: [id, title, type, status, created]
optional_fields: [priority, version, rationale, tags, suspect, fingerprint, links, doc_refs, upstream, checklists_applied, modified, output_files, thinking_techniques]
allowed_status:
  draft: []
  approved: [draft]
  implemented: [approved]
  verified: [implemented]
  deprecated: [approved, implemented, verified]
  # supersession pairing: the new artifact links `supersedes` -> this one first,
  # then this artifact's status moves to superseded (not from draft; use cancelled instead).
  superseded: [approved, implemented, verified]
  cancelled: [draft, approved, implemented, verified]
allowed_link_roles: [refined_by, verified_by, derives_from, guided_by, complies_with, supersedes]
directory: _specflow/specs/architecture/
