domain: generic
level: phase
phase: plan-story
process_area: Story Decomposition
generated: bundled
best_practices:
  - id: BP-PHASE-STORY-01
    title: Slice stories vertically through the full stack
    description: |
      Each story must deliver end-to-end user value, touching all necessary
      layers (UI, logic, data). Horizontal stories (e.g., "set up database")
      create integration risk because nothing works until everything works.
    evaluation: 'Does the story deliver testable value even if no other stories are implemented?'
    anti_pattern: |
      A sprint contains "set up database schema", "build API endpoints",
      and "create UI forms" as separate stories — none delivers value
      alone and integration reveals mismatches.
    pitfalls:
      - Confusing technical layers with user value
      - Stories that require other stories to demonstrate functionality

  - id: BP-PHASE-STORY-02
    title: Ensure stories are independently implementable
    description: |
      Each story must be implementable and testable in isolation. If a story
      requires another story to be complete before it can be verified, it
      should be expressed as a dependency or merged with its prerequisite.
    evaluation: 'Can a developer pick up this story and deliver it without waiting for another story?'
    anti_pattern: |
      Story A says "display user profile" and Story B says "create user
      profile API" — Story A cannot be verified without Story B, but they
      are marked as independent.
    pitfalls:
      - Implicit dependencies through shared data structures
      - Stories that are only testable with mock data from another story

  - id: BP-PHASE-STORY-03
    title: Write acceptance criteria with measurable outcomes
    description: |
      Every acceptance criterion must be a Given/When/Then statement with
      a specific, measurable expected outcome. "Works correctly" and
      "behaves as expected" are not testable.
    evaluation: 'Can a tester verify this criterion without asking the developer what they meant?'
    anti_pattern: |
      An acceptance criterion states "the system handles errors gracefully"
      with no definition of which errors, what graceful means, or what
      the user sees.
    pitfalls:
      - Criteria that describe implementation rather than behavior
      - Missing error/edge case criteria

  - id: BP-PHASE-STORY-04
    title: Size stories to fit a single implementation wave
    description: |
      Each story should be completable within one implementation cycle. If
      a story requires multiple sessions or exceeds 8 acceptance criteria,
      it likely contains multiple stories that should be split.
    evaluation: 'Can a single developer complete this story in one focused session?'
    anti_pattern: |
      A story titled "implement user management" has 15 acceptance criteria
      covering registration, login, password reset, profile editing, and
      account deletion — it spans an entire sprint.
    pitfalls:
      - Stories that grow during implementation as scope is discovered
      - Acceptance criteria that are actually sub-stories

  - id: BP-PHASE-STORY-05
    title: Cover happy path and at least two edge cases
    description: |
      Every story must have acceptance criteria for the happy path plus
      at least two error or edge cases. Common edge cases include empty
      input, invalid input, concurrent access, and resource exhaustion.
    evaluation: 'Does the story have at least 3 acceptance criteria covering success and failure modes?'
    anti_pattern: |
      A story for "export data to CSV" has one acceptance criterion for the
      happy path — no criteria for empty datasets, permission errors, or
      timeout on large exports.
    pitfalls:
      - Edge cases that exist only in theory and never in the acceptance criteria
      - Assuming error handling is "someone else's concern"

common_pitfalls:
  - Stories that are technically complete but deliver no user-visible value
  - Acceptance criteria that cannot be verified without implementation knowledge
  - Stories sized for estimation convenience rather than delivery value
