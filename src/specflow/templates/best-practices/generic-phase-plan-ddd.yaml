domain: generic
level: phase
phase: plan-ddd
process_area: Software Detailed Design
generated: bundled
best_practices:
  - id: BP-PHASE-DDD-01
    title: Type all data structures explicitly
    description: |
      Every data structure must have defined field types, required/optional
      status, and valid ranges. Untyped or loosely typed data structures
      are the primary source of runtime errors at boundaries.
    evaluation: 'Does every data structure have a schema that a validator can check against?'
    anti_pattern: |
      A function accepts a dict with no documented keys — callers pass
      "name", "Name", and "nm" interchangeably, and silent data loss
      accumulates until a production incident.
    pitfalls:
      - Using generic map types instead of typed structures
      - Optional fields with no default value documentation

  - id: BP-PHASE-DDD-02
    title: Specify algorithm complexity and boundaries
    description: |
      Every non-trivial algorithm must state its expected time and space
      complexity, plus the maximum input size it is designed to handle.
      This prevents silent degradation under load.
    evaluation: 'Does each algorithm documentation include O() notation and max expected input size?'
    anti_pattern: |
      A search function is documented as "finds the matching record" but
      is O(n^2) — it works fine with 100 records but takes 30 seconds
      with 10,000.
    pitfalls:
      - Assuming small input sizes that grow over time
      - Undocumented early-exit conditions

  - id: BP-PHASE-DDD-03
    title: Handle boundary errors at every system edge
    description: |
      Every function that interacts with an external system (file I/O,
      network, database, user input) must define what happens for empty
      input, null input, oversized input, and malformed input.
    evaluation: 'Does the design specify behavior for null, empty, oversized, and malformed inputs?'
    anti_pattern: |
      A file parser assumes well-formed input and crashes on the first
      malformed line with an unhelpful traceback — the caller has no
      recovery path.
    pitfalls:
      - Assuming internal callers will never pass bad data
      - Catching exceptions too broadly, masking root causes

  - id: BP-PHASE-DDD-04
    title: Document preconditions and invariants
    description: |
      Every function with non-obvious requirements must state its
      preconditions (what must be true before calling) and invariants
      (what it guarantees during execution). These form the contract.
    evaluation: 'Can a new developer call this function correctly by reading only the preconditions?'
    anti_pattern: |
      A cache update function requires the key to exist before updating
      but does not check — calling it with a new key silently corrupts
      the cache state.
    pitfalls:
      - Preconditions that exist only in the original developer's mind
      - Invariants that are tested but not documented

common_pitfalls:
  - Detailed designs that restate the architecture without adding implementation detail
  - Missing error handling for the happy path's failure modes
  - Data structures that evolve without updating their validation rules
