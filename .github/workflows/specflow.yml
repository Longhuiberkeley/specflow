name: SpecFlow

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']

jobs:
  specflow-pass-1:
    name: Pass 1 — programmatic validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install SpecFlow
        run: uv sync
      - name: Validate artifacts (deterministic, zero tokens)
        run: uv run specflow artifact-lint --method programmatic
  pytest:
    name: Run tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}
      - name: Run pytest
        run: uv run pytest tests/ -v
  specflow-wheel-smoke:
    # Release verification: build a wheel from this source tree, install it into
    # an isolated venv, init a throwaway project with the *installed* entry
    # point, and confirm `specflow status`/`brief` run and every packaged asset
    # (schemas, skills + references, checklists, packs, agent-context) is
    # present. Also runs on tag pushes via the workflow's `tags: ['v*']` trigger.
    name: Wheel smoke (isolated install/init)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install SpecFlow (build tooling)
        run: uv sync
      - name: Wheel smoke
        run: ./scripts/wheel-smoke.sh
  specflow-project-audit:
    name: Project audit
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install SpecFlow
        run: uv sync
      - name: Project audit
        run: uv run specflow project-audit 2>&1 | tee audit-report.txt
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit-report.txt
  specflow-change-impact:
    name: Change-impact review
    runs-on: ubuntu-latest
    needs: specflow-pass-1
    if: ${{ github.event_name == 'pull_request' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install SpecFlow
        run: uv sync
      - name: Change-impact review
        run: uv run specflow change-impact || true
  specflow-ci-gate:
    # Server-side RBAC gate: validates artifact status transitions in the PR
    # diff against the team-role model. Pull-request only (no base/head refs on
    # a push). Mirrors the job lib/adapters/github_actions.py emits for consumers,
    # adapted to this repo's uv-sync bootstrap.
    name: CI gate (RBAC)
    runs-on: ubuntu-latest
    needs: specflow-pass-1
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install SpecFlow
        run: uv sync
      - name: RBAC gate check
        run: uv run specflow ci-gate --base ${{ github.base_ref }} --head ${{ github.head_ref }}
  specflow-release-gate:
    # Authoritative release gate on tag pushes. Runs project-audit WITHOUT
    # continue-on-error: safe because accounting-not-policing lenses
    # (docs-staleness) are excluded from the exit-2 count, so only structural
    # signals can block a release. The informational project-audit job above
    # still runs on every branch push.
    name: Release gate
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install SpecFlow
        run: uv sync
      - name: Release gate check
        run: uv run specflow project-audit && echo "Release gate passed"
