name: SpecFlow

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  specflow-pass-1:
    name: Pass 1 — programmatic validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install SpecFlow
        run: uv sync
      - name: Validate artifacts (deterministic, zero tokens)
        run: uv run specflow artifact-lint --method programmatic
  pytest:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync
      - name: Run pytest
        run: uv run pytest tests/ -v
  specflow-project-audit:
    name: Project audit
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install SpecFlow
        run: uv sync
      - name: Project audit
        run: uv run specflow project-audit 2>&1 | tee audit-report.txt
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit-report.txt
  specflow-change-impact:
    name: Change-impact review
    runs-on: ubuntu-latest
    needs: specflow-pass-1
    if: ${{ github.event_name == 'pull_request' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install SpecFlow
        run: uv sync
      - name: Change-impact review
        run: uv run specflow change-impact || true
